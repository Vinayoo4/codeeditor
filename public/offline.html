<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - EcoMeal Hub</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      h1 {
        color: #10b981;
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.125rem;
        color: #4b5563;
        margin-bottom: 2rem;
        max-width: 500px;
      }
      .brand {
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: #10b981;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        background-color: #10b981;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #059669;
      }
    </style>
  </head>
  <body>
    <div class="brand">ECO-MEAL HUB</div>
    <h1>You are offline</h1>
    <p>Your saved meal plans and saved articles are available below.</p>
    <a href="/">Go to App</a>
  </body>
</html>
